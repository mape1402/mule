name: Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'samples/**'
      - '.github/workflows/**'
      - '.release'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'assets/**'
      - '*.sln'
      - 'Directory.Build.props'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'samples/**'
      - '.github/workflows/**'
      - '.release'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'assets/**'
      - '*.sln'
      - 'Directory.Build.props'

env:
  CHANGELOG_PATH: CHANGELOG.md
  RELEASE_BRANCH_PREFIX: releases/
  RELEASE_MARKER_PATH: .release
  RELEASE_TAG_PATTERN: ^v[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Create release branch from marker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          set -euo pipefail

          if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "$RELEASE_MARKER_PATH"; then
            echo "$RELEASE_MARKER_PATH did not change in this push. Skipping release branch creation."
            exit 0
          fi

          if [[ ! -f "$RELEASE_MARKER_PATH" ]]; then
            echo "$RELEASE_MARKER_PATH was removed. Skipping release branch creation."
            exit 0
          fi

          NON_EMPTY_LINES="$(grep -cve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" || true)"
          if [[ "$NON_EMPTY_LINES" != "1" ]]; then
            echo "$RELEASE_MARKER_PATH must contain exactly one non-empty line with the release tag, for example v1.0.0."
            exit 1
          fi

          TAG="$(grep -ve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" | tr -d '[:space:]')"
          if [[ ! "$TAG" =~ $RELEASE_TAG_PATTERN ]]; then
            echo "$RELEASE_MARKER_PATH must contain a tag matching $RELEASE_TAG_PATTERN. Current value: $TAG"
            exit 1
          fi

          if ! grep -q -E "^## \\[$TAG\\]" "$CHANGELOG_PATH"; then
            echo "$CHANGELOG_PATH must contain a section for $TAG before creating the release branch."
            exit 1
          fi

          BRANCH="$RELEASE_BRANCH_PREFIX$TAG"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Release branch $BRANCH already exists. Skipping creation."
            exit 0
          fi

          if [[ -z "${RELEASE_BOT_TOKEN:-}" ]]; then
            echo "Repository secret RELEASE_BOT_TOKEN must be set so the branch push can trigger the release workflow."
            exit 1
          fi

          git config user.name "mule-release-bot"
          git config user.email "mule-release-bot@users.noreply.github.com"
          git branch "$BRANCH" "${{ github.sha }}"
          git push "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$BRANCH"
